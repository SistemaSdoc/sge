name: CI/CD SGE

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # ─────────────────────────────────────────
  # JOB 1: CI — Verifica se o código está ok
  # ─────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do GitHub para dentro da máquina virtual
      - name: Checkout código
        uses: actions/checkout@v4

      # Instala o PHP 8.5 e o Composer na máquina virtual
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      # Instala o Node 24 na máquina virtual
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Instala os pacotes do package.json (React, Inertia, etc)
      - name: Instalar dependências Node
        run: npm install

      # Instala os pacotes do composer.json (Laravel, etc)
      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # O .env real não está no GitHub (está no .gitignore)
      # Cria um .env temporário só para os testes correrem
      - name: Copiar .env
        run: cp .env.example .env

      # O Laravel precisa de uma APP_KEY para funcionar
      - name: Gerar chave da aplicação
        run: php artisan key:generate

      # Compila o React/Inertia — verifica se o frontend não tem erros
      - name: Build assets
        run: npm run build

      # Corre todos os testes — se algum falhar o deploy não acontece!
      - name: Correr testes
        run: php artisan test

  # ─────────────────────────────────────────────────────────
  # JOB 2: CD — Só corre se o CI passou E é push para o main
  # ─────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: ci # aguarda o CI terminar com sucesso
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Baixa o código novamente para esta máquina de deploy
      - name: Checkout código
        uses: actions/checkout@v4

      # Configura a chave SSH para conectar ao servidor cPanel
      # A chave privada está guardada nos secrets do GitHub
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Envia só os ficheiros necessários para o servidor
      # Exclui .env (dados sensíveis), vendor e node_modules (pesados)
      - name: Enviar ficheiros
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/logs' \
            --exclude='storage/app' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/teste.sdoca.it.ao/

      # Entra no servidor via SSH e finaliza o deploy
      - name: Finalizar no servidor
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
                cd ~/teste.sdoca.it.ao &&
                composer install --no-dev --optimize-autoloader &&
                npm install &&
                npm run build &&
                php artisan migrate --force &&
                php artisan config:cache &&
                php artisan route:cache &&
                php artisan view:cache &&
                php artisan storage:link
              "